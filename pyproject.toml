[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terralink-core"
version = "0.1.0a1"
description = "Standalone ecological connectivity and habitat corridor planning"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-or-later"
authors = [{name = "Benjamin Bishop"}]
dependencies = ["numpy>=1.26,<3", "shapely>=2.0,<3", "pyproj>=3.6,<4", "rasterio>=1.3,<2", "pyogrio>=0.9,<1"]

[project.optional-dependencies]
web = ["flask>=3,<4"]
test = ["pytest>=8", "jsonschema>=4", "build>=1"]

[project.scripts]
terralink = "terralink_core.cli:main"

[project.urls]
Repository = "https://github.com/sorus-tools/terralink-core"
"QGIS plugin" = "https://github.com/sorus-tools/TerraLink"
"R package" = "https://github.com/sorus-tools/terralink-r"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terralink_core = ["web_static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
